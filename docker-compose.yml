services:
  # 1. Traefik Reverse Proxy & Gateway (Unified entrypoint on 8180)
  traefik:
    image: traefik:v3.1
    container_name: foxshop_traefik
    command:
      - "--providers.docker=true"
      - "--providers.docker.exposedbydefault=false"
      - "--entrypoints.web.address=:80"
      - "--api.insecure=true"
      - "--api.dashboard=true"
    ports:
      - "8180:80"    # Main FoxShop Gateway (Web, API, WebSockets)
      - "8188:8080"  # Traefik Dashboard (dev only)
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock:ro
    networks:
      - foxshop-network
    restart: unless-stopped


  # 2. PostgreSQL 16 + PostGIS (Isolated inside Docker network)
  db:
    image: postgis/postgis:16-3.4
    container_name: foxshop_db
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-foxshop_db}
      POSTGRES_USER: ${POSTGRES_USER:-foxshop_user}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-foxshop_password}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    networks:
      - foxshop-network
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-foxshop_user} -d ${POSTGRES_DB:-foxshop_db}"]
      interval: 5s
      timeout: 5s
      retries: 10
    restart: unless-stopped

  # 3. Redis 7 (Isolated inside Docker network)
  redis:
    image: redis:7-alpine
    container_name: foxshop_redis
    command: ["redis-server", "--appendonly", "yes"]
    volumes:
      - redis_data:/data
    networks:
      - foxshop-network
    restart: unless-stopped

  # 4. Centrifugo v5 Real-time (Routed via Traefik on 8180)
  centrifugo:
    build:
      context: ./backend
      dockerfile: Dockerfile.centrifugo
    container_name: foxshop_centrifugo
    command: centrifugo -c config.json
    labels:
      - "traefik.enable=true"
      - "traefik.http.routers.centrifugo.rule=PathPrefix(`/connection/websocket`)"
      - "traefik.http.routers.centrifugo.entrypoints=web"
      - "traefik.http.services.centrifugo.loadbalancer.server.port=8000"
    networks:
      - foxshop-network
    depends_on:
      - redis
    restart: unless-stopped

  # 5. MinIO S3 Object Storage (Ports 9100 and 9101)
  minio:
    image: minio/minio:latest
    container_name: foxshop_minio
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER:-minio_admin}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD:-minio_secret_pass_2026}
    ports:
      - "9100:9000"  # S3 API endpoint
      - "9101:9001"  # MinIO Web Console
    volumes:
      - minio_data:/data
    labels:
      - "traefik.enable=true"
      - "traefik.http.routers.minio.rule=PathPrefix(`/media/`)"
      - "traefik.http.routers.minio.entrypoints=web"
      - "traefik.http.services.minio.loadbalancer.server.port=9000"
    networks:
      - foxshop-network
    restart: unless-stopped

  # 6. Django Web API (ASGI via Gunicorn + Uvicorn)
  web:
    build:
      context: ./backend
      dockerfile: Dockerfile
    image: foxshop_web:latest
    container_name: foxshop_web
    command: gunicorn core.asgi:application -k uvicorn.workers.UvicornWorker --bind 0.0.0.0:8000 --workers 3 --reload
    environment:
      - DEBUG=1
      - SECRET_KEY=${SECRET_KEY:-foxshop-super-insecure-dev-key-change-in-prod}
      - DATABASE_NAME=${POSTGRES_DB:-foxshop_db}
      - DATABASE_USER=${POSTGRES_USER:-foxshop_user}
      - DATABASE_PASSWORD=${POSTGRES_PASSWORD:-foxshop_password}
      - DATABASE_HOST=db
      - DATABASE_PORT=5432
      - REDIS_URL=redis://redis:6379/0
      - CENTRIFUGO_API_URL=http://centrifugo:8000/api
      - CENTRIFUGO_API_KEY=foxshop-super-secret-centrifugo-api-key-2026
      - CENTRIFUGO_HMAC_SECRET=foxshop-super-secret-centrifugo-token-key-2026
      - AWS_S3_ENDPOINT_URL=http://minio:9000
      - AWS_ACCESS_KEY_ID=${MINIO_ROOT_USER:-minio_admin}
      - AWS_SECRET_ACCESS_KEY=${MINIO_ROOT_PASSWORD:-minio_secret_pass_2026}
      - AWS_STORAGE_BUCKET_NAME=foxshop-media
      - AWS_S3_CUSTOM_DOMAIN=localhost:9100/foxshop-media
      - INNGEST_BASE_URL=http://inngest:8288
      - MEILISEARCH_URL=http://meilisearch:7700
      - MEILISEARCH_KEY=foxshop_meili_master_key_2026
      - OSRM_URL=http://osrm:5000
      - VROOM_URL=http://vroom:3000
      - IMGPROXY_URL=http://imgproxy:8080
    ports:
      - "${HTTP_PORT:-8100}:8000" # Direct Web API fallback port
    labels:
      - "traefik.enable=true"
      - "traefik.http.routers.web.rule=PathPrefix(`/`)"
      - "traefik.http.routers.web.entrypoints=web"
      - "traefik.http.services.web.loadbalancer.server.port=8000"
    networks:
      - foxshop-network
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_started
    restart: unless-stopped

  # 7. Inngest Dev Server & Workflow Engine (Dashboard on 8289)
  inngest:
    image: inngest/inngest:latest
    container_name: foxshop_inngest
    command: ["inngest", "dev", "--host", "0.0.0.0", "-u", "http://web:8000/api/inngest/"]
    ports:
      - "8289:8288" # Inngest Dev Dashboard
    labels:
      - "traefik.enable=true"
      - "traefik.http.routers.inngest.rule=PathPrefix(`/inngest`)"
      - "traefik.http.routers.inngest.entrypoints=web"
      - "traefik.http.services.inngest.loadbalancer.server.port=8288"
    networks:
      - foxshop-network
    restart: unless-stopped

  # 8. imgproxy Dynamic Image Optimizer (Routed via Traefik on 8180)
  imgproxy:
    image: darthsim/imgproxy:latest
    container_name: foxshop_imgproxy
    environment:
      - IMGPROXY_USE_S3=true
      - IMGPROXY_S3_ENDPOINT=http://minio:9000
      - AWS_ENDPOINT_URL=http://minio:9000
      - IMGPROXY_S3_USE_PATH_STYLE=true
      - AWS_ACCESS_KEY_ID=${MINIO_ROOT_USER:-minio_admin}
      - AWS_SECRET_ACCESS_KEY=${MINIO_ROOT_PASSWORD:-minio_secret_pass_2026}
      - IMGPROXY_PATH_PREFIX=/imgproxy/
    labels:
      - "traefik.enable=true"
      - "traefik.http.routers.imgproxy.rule=PathPrefix(`/imgproxy/`)"
      - "traefik.http.routers.imgproxy.entrypoints=web"
      - "traefik.http.services.imgproxy.loadbalancer.server.port=8080"
    networks:
      - foxshop-network
    depends_on:
      - minio
    restart: unless-stopped

  # 9. Meilisearch Instant Typo-Tolerant Search Engine (Routed via Traefik on 8180)
  meilisearch:
    image: getmeili/meilisearch:v1.12
    container_name: foxshop_meilisearch
    environment:
      - MEILI_MASTER_KEY=foxshop_meili_master_key_2026
      - MEILI_NO_ANALYTICS=true
      - MEILI_ENV=development
      - MEILI_DB_PATH=/meili_data
    volumes:
      - meili_data:/meili_data
    labels:
      - "traefik.enable=true"
      - "traefik.http.routers.meili.rule=PathPrefix(`/meili/`)"
      - "traefik.http.routers.meili.entrypoints=web"
      - "traefik.http.services.meili.loadbalancer.server.port=7700"
    networks:
      - foxshop-network
    restart: unless-stopped

  # 10. OSRM Egypt Road Routing Engine (Internal)
  osrm:
    image: ghcr.io/project-osrm/osrm-backend:latest
    container_name: foxshop_osrm
    entrypoint: ["sh", "-c", "if [ -f /data/egypt-latest.osrm ]; then exec osrm-routed --algorithm mld /data/egypt-latest.osrm; else echo 'OSRM: Egypt map not ready yet. Please run ./scripts/setup_osrm_egypt.sh to download and prepare the map.'; sleep infinity; fi"]
    volumes:
      - ./osrm_data:/data
    networks:
      foxshop-network:
        aliases:
          - osrm
          - osrm-car
    restart: unless-stopped

  # 11. VROOM Multi-Stop Delivery Optimizer (Internal)
  vroom:
    image: vroomvrp/vroom-docker:v1.14.0
    container_name: foxshop_vroom
    environment:
      - VROOM_ROUTER=osrm
    networks:
      - foxshop-network
    depends_on:
      - osrm
    restart: unless-stopped


networks:
  foxshop-network:
    name: foxshop-network
    driver: bridge

volumes:
  postgres_data:
  redis_data:
  minio_data:
  meili_data:
